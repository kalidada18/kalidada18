name: Metrics

on:
  schedule:
    # Refresh twice a day
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Render metrics dashboard
        uses: lowlighter/metrics@latest
        with:
          # Public profile data only; falls back to the built-in token if no PAT is set.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          # Commit the generated SVG to a dedicated branch so it never clobbers the snake's `output` branch.
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: metrics
          filename: github-metrics.svg
          user: kalidada18

          template: classic
          base: header, activity, community
          config_timezone: Asia/Kathmandu
          config_display: regular

          # Commit calendar (isometric)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Language breakdown with real brand colors
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # Trophies (replaces the dead github-profile-trophy card)
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_display: compact

          # Lines of code changed
          plugin_lines: yes

          # Nudge GitHub primer accents toward the crimson brand
          css: |
            :root, svg { --color-accent-emphasis: #FF1744; --color-accent-muted: rgba(255, 23, 68, 0.4); }
