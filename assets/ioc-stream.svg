<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Animated Threatbase pipeline: 54 OSINT feeds converge into a fetch, deduplicate and classify engine that outputs IOC blocklists, a live dashboard, and retrospective archives">
  <defs>
    <pattern id="gridIoc" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#141821" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="#0a0a0f"/>
  <rect width="1200" height="300" fill="url(#gridIoc)"/>

  <text x="600" y="28" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" fill="#6b7280" letter-spacing="6">OSINT&#160;INTAKE&#160;//&#160;54&#160;FEEDS&#160;&#8594;&#160;MILLIONS&#160;OF&#160;IOCs</text>

  <!-- ═══ input feed chips (left) ═══ -->
  <g font-family="'Courier New',Consolas,monospace" font-size="12">
    <rect x="28" y="46"  width="150" height="28" rx="6" fill="#0e1016" stroke="#262b38"/><text x="103" y="64"  text-anchor="middle" fill="#8b949e">AbuseCH</text>
    <rect x="28" y="86"  width="150" height="28" rx="6" fill="#0e1016" stroke="#262b38"/><text x="103" y="104" text-anchor="middle" fill="#8b949e">Spamhaus</text>
    <rect x="28" y="126" width="150" height="28" rx="6" fill="#0e1016" stroke="#262b38"/><text x="103" y="144" text-anchor="middle" fill="#8b949e">AlienVault OTX</text>
    <rect x="28" y="166" width="150" height="28" rx="6" fill="#0e1016" stroke="#262b38"/><text x="103" y="184" text-anchor="middle" fill="#8b949e">Emerging</text>
    <rect x="28" y="206" width="150" height="28" rx="6" fill="#0e1016" stroke="#262b38"/><text x="103" y="224" text-anchor="middle" fill="#8b949e">PhishTank</text>
    <rect x="28" y="246" width="150" height="28" rx="6" fill="#12080c" stroke="#FF1744"/><text x="103" y="264" text-anchor="middle" fill="#FF1744">+48 more feeds</text>
  </g>

  <!-- ═══ convergence curves into engine ═══ -->
  <g stroke="#2a3450" stroke-width="1.6" fill="none" stroke-dasharray="5 8">
    <path d="M178 60  C 300 60, 340 120, 452 142">
      <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M178 100 C 300 100, 340 128, 452 144">
      <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M178 140 C 300 140, 340 142, 452 146">
      <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M178 180 C 300 180, 340 158, 452 150">
      <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M178 220 C 300 220, 340 172, 452 152">
      <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M178 260 C 300 260, 340 190, 452 156">
      <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- intake packets -->
  <g>
    <circle r="4" fill="#FF1744"><animateMotion dur="2.2s" repeatCount="indefinite"          path="M178 60  C 300 60, 340 120, 452 142"/></circle>
    <circle r="4" fill="#FF1744"><animateMotion dur="2.2s" begin="0.4s" repeatCount="indefinite" path="M178 100 C 300 100, 340 128, 452 144"/></circle>
    <circle r="4" fill="#FF1744"><animateMotion dur="2.2s" begin="0.8s" repeatCount="indefinite" path="M178 140 C 300 140, 340 142, 452 146"/></circle>
    <circle r="4" fill="#39d353"><animateMotion dur="2.2s" begin="1.2s" repeatCount="indefinite" path="M178 180 C 300 180, 340 158, 452 150"/></circle>
    <circle r="4" fill="#39d353"><animateMotion dur="2.2s" begin="1.6s" repeatCount="indefinite" path="M178 220 C 300 220, 340 172, 452 152"/></circle>
    <circle r="4" fill="#f7a41d"><animateMotion dur="2.2s" begin="2.0s" repeatCount="indefinite" path="M178 260 C 300 260, 340 190, 452 156"/></circle>
  </g>

  <!-- ═══ engine ═══ -->
  <g font-family="'Courier New',Consolas,monospace">
    <rect x="452" y="106" width="240" height="88" rx="12" fill="#12080c" stroke="#FF1744" stroke-width="1.6"/>
    <rect x="452" y="106" width="240" height="88" rx="12" fill="none" stroke="#FF1744" stroke-width="1.6" opacity="0.9">
      <animate attributeName="x" values="452;456;452" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.25;0.9" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <text x="572" y="142" text-anchor="middle" font-size="15" fill="#FF1744" font-weight="bold">FETCH &#183; DEDUPE</text>
    <text x="572" y="166" text-anchor="middle" font-size="13" fill="#8b949e">Classify Engine</text>

    <!-- ═══ outputs ═══ -->
    <g stroke="#2a3450" stroke-width="1.6" fill="none" stroke-dasharray="5 8">
      <path d="M692 128 C 760 128, 780 82, 848 74">
        <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.4s" repeatCount="indefinite"/>
      </path>
      <path d="M692 150 H848">
        <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.4s" repeatCount="indefinite"/>
      </path>
      <path d="M692 172 C 760 172, 780 218, 848 226">
        <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <circle r="4" fill="#e6edf3"><animateMotion dur="1.8s" repeatCount="indefinite" path="M692 128 C 760 128, 780 82, 848 74"/></circle>
    <circle r="4" fill="#e6edf3"><animateMotion dur="1.8s" begin="0.6s" repeatCount="indefinite" path="M692 150 H848"/></circle>
    <circle r="4" fill="#e6edf3"><animateMotion dur="1.8s" begin="1.2s" repeatCount="indefinite" path="M692 172 C 760 172, 780 218, 848 226"/></circle>

    <rect x="848" y="44" width="322" height="60" rx="10" fill="#0e1016" stroke="#262b38" stroke-width="1.5"/>
    <text x="1009" y="70" text-anchor="middle" font-size="14" fill="#e6edf3" font-weight="bold">IOC BLOCKLISTS</text>
    <text x="1009" y="92" text-anchor="middle" font-size="12" fill="#8b949e">IP &#183; CIDR &#183; Domain &#183; URL &#183; SHA-256</text>

    <rect x="848" y="120" width="322" height="60" rx="10" fill="#0a120c" stroke="#39d353" stroke-width="1.5"/>
    <text x="1009" y="146" text-anchor="middle" font-size="14" fill="#39d353" font-weight="bold">LIVE DASHBOARD</text>
    <text x="1009" y="168" text-anchor="middle" font-size="12" fill="#8b949e">threatbase.qzz.io</text>

    <rect x="848" y="196" width="322" height="60" rx="10" fill="#14100a" stroke="#f7a41d" stroke-width="1.5"/>
    <text x="1009" y="222" text-anchor="middle" font-size="14" fill="#f7a41d" font-weight="bold">RETROSPECTIVE STORE</text>
    <text x="1009" y="244" text-anchor="middle" font-size="12" fill="#8b949e">ZIP Archives &#38; Git Mirrors</text>
  </g>
</svg>
