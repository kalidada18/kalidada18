<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="img" aria-label="Animated section divider">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF1744" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF1744" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF1744" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="12" x2="1200" y2="12" stroke="#1f2634" stroke-width="1"/>
  <rect y="10" width="220" height="4" rx="2" fill="url(#pulse)">
    <animate attributeName="x" values="-220;1200" dur="4s" repeatCount="indefinite"/>
  </rect>
  <circle cy="12" r="3" fill="#FF1744">
    <animate attributeName="cx" values="-10;1210" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cy="12" r="3" fill="#39d353" opacity="0.9">
    <animate attributeName="cx" values="1210;-10" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
