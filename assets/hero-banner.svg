<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Animated SOC console hero banner - Sujal Lamichhane cybersecurity operations">
  <defs>
    <radialGradient id="crimsonGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FF1744" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FF1744" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF1744" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF1744" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF1744" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF1744" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF1744" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a1f2b" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="320" fill="#0a0a0f"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.6"/>
  <rect width="1200" height="320" fill="url(#crimsonGlow)"/>

  <!-- moving scan bar -->
  <rect y="0" width="140" height="320" fill="url(#scanFade)">
    <animate attributeName="x" values="-140;1200" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- ══════════ TERMINAL WINDOW (left) ══════════ -->
  <g font-family="'Courier New',Consolas,monospace">
    <rect x="42" y="46" width="580" height="228" rx="10" fill="#0e1016" stroke="#262b38" stroke-width="1.5"/>
    <rect x="42" y="46" width="580" height="34" rx="10" fill="#151923"/>
    <rect x="42" y="70" width="580" height="10" fill="#151923"/>
    <circle cx="66" cy="63" r="5.5" fill="#FF1744"/>
    <circle cx="84" cy="63" r="5.5" fill="#f7a41d"/>
    <circle cx="102" cy="63" r="5.5" fill="#39d353"/>
    <text x="126" y="68" font-size="13" fill="#6b7280">sujal@kali — soc-console</text>

    <!-- typed lines, staggered reveal on an 8s loop -->
    <text x="64" y="112" font-size="16" fill="#39d353" opacity="0">$ whoami
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.03;0.06;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="64" y="140" font-size="16" fill="#e6edf3" opacity="0">sujal &#8212; security operations analyst / researcher
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.16;0.19;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="64" y="168" font-size="16" fill="#39d353" opacity="0">$ ./threat_hunt --feed threatbase
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.30;0.33;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="64" y="196" font-size="16" fill="#9aa4b2" opacity="0">[+] 54 OSINT feeds synced &#183; millions of IOCs
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.44;0.47;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="64" y="224" font-size="16" fill="#FF1744" font-weight="bold" opacity="0">[!] detection pipeline: ARMED
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.61;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="64" y="252" font-size="16" fill="#39d353" opacity="0">$
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.75;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <!-- blinking cursor -->
    <rect x="86" y="238" width="9" height="17" fill="#e6edf3" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;1;0;1" keyTimes="0;0.72;0.75;0.78;0.83;0.88;1" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ══════════ PACKET FLOW (terminal -> radar) ══════════ -->
  <path id="flow" d="M622 160 C 700 160, 720 96, 796 128" fill="none" stroke="#22304a" stroke-width="2" stroke-dasharray="6 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <path d="M622 160 C 700 160, 740 224, 800 196" fill="none" stroke="#22304a" stroke-width="2" stroke-dasharray="6 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <circle r="4" fill="#FF1744">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M622 160 C 700 160, 720 96, 796 128"/>
  </circle>
  <circle r="4" fill="#39d353">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M622 160 C 700 160, 740 224, 800 196"/>
  </circle>

  <!-- ══════════ RADAR SWEEP (right) ══════════ -->
  <g transform="translate(960,160)">
    <circle r="118" fill="#0d1017" stroke="#262b38" stroke-width="1.5"/>
    <circle r="88" fill="none" stroke="#1f2634" stroke-width="1"/>
    <circle r="55" fill="none" stroke="#1f2634" stroke-width="1"/>
    <circle r="22" fill="none" stroke="#1f2634" stroke-width="1"/>
    <line x1="-118" y1="0" x2="118" y2="0" stroke="#1f2634" stroke-width="1"/>
    <line x1="0" y1="-118" x2="0" y2="118" stroke="#1f2634" stroke-width="1"/>

    <!-- rotating sweep wedge -->
    <g>
      <path d="M0 0 L0 -118 A118 118 0 0 1 83 -83 Z" fill="url(#sweepGrad)" opacity="0.8"/>
      <line x1="0" y1="0" x2="0" y2="-118" stroke="#FF1744" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </g>

    <!-- radar blips -->
    <circle cx="62" cy="-40" r="4" fill="#FF1744">
      <animate attributeName="opacity" values="1;0;0;1" keyTimes="0;0.2;0.9;1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-70" cy="34" r="4" fill="#39d353">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.45;0.65;1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="28" cy="86" r="4" fill="#f7a41d">
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.6;0.75;0.95" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#e6edf3"/>
  </g>

  <!-- radar label -->
  <text x="960" y="304" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" fill="#6b7280" letter-spacing="4">THREAT&#160;VECTOR&#160;SCAN</text>
  <text x="332" y="304" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" fill="#6b7280" letter-spacing="4">SOC&#160;//&#160;LIVE&#160;CONSOLE</text>
</svg>
